<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXPLAY — Browser Games</title>
<meta name="description" content="NEXPLAY is a library of original games that run in your browser.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060a18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:inherit}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#060a18;
  --ink:#eaf0ff;
  --muted:rgba(234,240,255,.74);
  --faint:rgba(234,240,255,.58);
  --violet:#9d5cff;
  --cyan:#29e1ff;
  --pink:#ff7ad9;
  --gold:#ffe66d;
  --glass:rgba(255,255,255,.07);
  --edge:rgba(170,195,255,.22);
  --shadow:0 18px 50px rgba(2,4,16,.55);
  --r-lg:28px;--r-md:20px;--r-sm:14px;
  --blur:20px;
  --display:Unbounded,"Trebuchet MS",system-ui,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-size-adjust:100%}
[hidden]{display:none!important}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-80px;z-index:100;background:#fff;color:#06091a;padding:10px 16px;border-radius:12px;font-weight:700}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
.muted{color:var(--muted)}

/* background layers */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#0d1438 0%,var(--bg) 60%)}
.orb{position:absolute;border-radius:50%;will-change:transform}
.o1{width:62vmax;height:62vmax;left:-24vmax;top:-26vmax;background:radial-gradient(circle,rgba(157,92,255,.36),transparent 62%);animation:drift1 30s ease-in-out infinite alternate}
.o2{width:56vmax;height:56vmax;right:-24vmax;top:8vh;background:radial-gradient(circle,rgba(41,225,255,.24),transparent 62%);animation:drift2 36s ease-in-out infinite alternate}
.o3{width:52vmax;height:52vmax;left:12vw;bottom:-32vmax;background:radial-gradient(circle,rgba(70,70,210,.32),transparent 62%);animation:drift1 42s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate3d(8vmax,6vmax,0) scale(1.08)}}
@keyframes drift2{to{transform:translate3d(-10vmax,8vmax,0) scale(.94)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body.playing .orb{animation-play-state:paused}
.app{position:relative;z-index:1}

/* glass surfaces */
.glass,.surface{position:relative;background:linear-gradient(120deg,rgba(255,255,255,.12),rgba(255,255,255,0) 42%),var(--glass);border:1px solid rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.glass{-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);backdrop-filter:blur(var(--blur)) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),var(--shadow)}
.glass::before,.surface::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(157,92,255,.28) 38%,rgba(41,225,255,.30) 72%,rgba(255,255,255,.12));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.glass{background:rgba(16,22,52,.95)}}
@media (max-width:720px){:root{--blur:12px}}

/* layout */
.wrap{width:min(1160px,calc(100% - 32px));margin-inline:auto}
main{display:block;outline:none;padding-bottom:24px}
.page-in{animation:pageIn .3s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sec{margin-top:56px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
.sec-head h2,.sec>h2{font-size:clamp(1.1rem,2.6vw,1.45rem)}
.sec-head a{font-weight:600;color:var(--cyan)}
.lede{font-size:1.1rem;color:var(--muted);max-width:52ch}

/* header */
.topwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding-top:12px}
.top{width:min(1160px,calc(100% - 24px));margin-inline:auto;border-radius:999px;display:flex;align-items:center;gap:14px;padding:8px 10px 8px 14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.wordmark{font:700 1.02rem/1 var(--display);letter-spacing:.04em}
.dnav{display:none;gap:4px;margin-left:8px}
.dnav a,.sheet a{padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:600;color:var(--muted);min-height:44px;display:inline-flex;align-items:center}
.dnav a:hover,.sheet a:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.dnav a[aria-current="page"],.sheet a[aria-current="page"]{color:var(--ink);background:rgba(255,255,255,.12)}
.hsearch{display:none;margin-left:auto;width:min(300px,34vw)}
.ibtn{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.sheet{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 8px);width:min(1160px,calc(100% - 24px));border-radius:var(--r-md);padding:8px;display:flex;flex-direction:column}
@media (min-width:900px){
  .dnav{display:flex}.hsearch{display:block}.ibtn,.sheet{display:none!important}
}

/* inputs, buttons, chips */
.field{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:var(--faint)}
.field:focus-within{outline:3px solid var(--cyan);outline-offset:2px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;min-height:42px}
.field input::placeholder{color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font:600 .95rem/1 Manrope,system-ui,sans-serif;border:1px solid transparent;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .2s,box-shadow .2s,background .2s}
.btn-primary{color:#06091a;background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 8px 24px rgba(157,92,255,.35)}
.btn-glass{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
@media (hover:hover){.btn:hover{transform:translateY(-1px)}.btn-glass:hover{background:rgba(255,255,255,.14)}.btn-primary:hover{box-shadow:0 10px 30px rgba(41,225,255,.4)}}
.ic{display:inline-flex}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:var(--ink);font:600 .93rem/1 Manrope,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.chip .count{font-weight:500;color:var(--muted);font-size:.85rem}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,rgba(157,92,255,.55),rgba(41,225,255,.4));border-color:rgba(255,255,255,.45);color:#fff}
@media (hover:hover){.chip:hover{background:rgba(255,255,255,.13)}}
select{min-height:44px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--ink);border:1px solid rgba(255,255,255,.16);font:600 .93rem Manrope,system-ui,sans-serif}
.tag{align-self:flex-start;display:inline-block;font-size:.8rem;font-weight:600;padding:3px 11px;border-radius:999px;background:rgba(41,225,255,.12);border:1px solid rgba(41,225,255,.38);color:#c2f5ff}
.tag.featured{background:rgba(255,230,109,.12);border-color:rgba(255,230,109,.42);color:#fff0a8}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:56px 0 8px}
.hero h1{font-size:clamp(1.9rem,5.2vw,3.5rem);line-height:1.08;margin-bottom:18px}
.hero .lede{margin-bottom:28px}
.hero-stage{position:relative;isolation:isolate}
.hero-orb{position:absolute;z-index:-1;width:62%;aspect-ratio:1;right:-8%;top:-14%;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(41,225,255,.8),rgba(157,92,255,.55) 55%,transparent 72%);animation:drift2 16s ease-in-out infinite alternate}
.hero-panel{border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:12px}
.hero-panel .cover{border-radius:var(--r-md)}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;padding:0 6px}
.hero-title{font-size:1.5rem;padding:0 6px}
.hero-title a{text-decoration:none}
.hero-panel>p,.hero-panel>.row{padding:0 6px 4px}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-top:28px;gap:32px}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:12px;transition:transform .3s,box-shadow .3s}
.surface::before{opacity:.75;transition:opacity .3s}
@media (hover:hover){.card:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 22px 44px rgba(41,225,255,.12)}.card:hover::before{opacity:1}.card:hover .cover svg{transform:scale(1.05)}}
.cover-wrap{position:relative}
.cover{position:relative;aspect-ratio:16/10;border-radius:var(--r-sm);overflow:hidden;background:#0b1030}
.cover svg{width:100%;height:100%;display:block;transition:transform .5s}
.fav{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);background:rgba(6,10,24,.55);color:#fff;cursor:pointer}
[data-fav][aria-pressed="true"] svg{fill:var(--pink);stroke:var(--pink)}
.card-body{padding:2px 8px 8px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-title{font-size:1.02rem}
.card-title a{text-decoration:none}
.desc{color:var(--muted);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-actions{margin-top:auto;padding-top:4px}
.card-actions .btn-primary{flex:1}

/* sections */
.cta{border-radius:var(--r-lg);padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cta h2{font-size:1.25rem;margin-bottom:6px}
.toolbar{border-radius:var(--r-lg);padding:16px;display:grid;gap:14px;margin:22px 0}
.toolbar-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar .field{flex:1;min-width:220px}
.count-line{margin:0 0 14px;color:var(--muted)}
.empty{border-radius:var(--r-lg);padding:32px;text-align:center;display:grid;gap:14px;justify-items:center}
.empty h2{font-size:1.2rem}
.mt{margin-top:56px}
.page-title{padding-top:36px}
.page-title h1{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:10px}
.prose{border-radius:var(--r-lg);padding:28px;max-width:760px;display:grid;gap:16px;margin-top:22px}
.prose p{color:var(--muted);max-width:66ch}
.prose a{color:var(--cyan)}
.prose h2{font-size:1.15rem}

/* detail */
.crumbs{padding-top:26px}
.crumbs a{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;font-weight:600;color:var(--muted)}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start;margin-top:8px}
.detail-cover{border-radius:var(--r-lg);padding:14px}
.detail-cover .cover{border-radius:var(--r-md)}
.detail-info{display:grid;gap:18px}
.detail-info h1{font-size:clamp(1.7rem,4vw,2.6rem)}
.panel{border-radius:var(--r-md);padding:22px;display:grid;gap:10px}
.panel h2{font-size:1rem;margin-top:6px}
.panel h2:first-child{margin-top:0}
.panel p{color:var(--muted)}
dl{margin:0}
.controls{display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
.controls dt{font-weight:700}
.controls dd{margin:0;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:6px}
.facts div{display:grid}
.facts dt{font-size:.85rem;color:var(--faint)}
.facts dd{margin:0;font-weight:600}
@media (max-width:900px){.detail{grid-template-columns:1fr}}

/* player */
.player-head{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;padding:20px 0 16px}
.player-head h1{font-size:clamp(1.3rem,3.4vw,1.9rem)}
.stage{position:relative;width:100%;height:clamp(380px,68vh,720px);height:clamp(380px,68dvh,720px);border-radius:var(--r-lg);overflow:hidden;background:#050816;border:1px solid var(--edge);box-shadow:var(--shadow)}
.stage:fullscreen{height:100%;border-radius:0;border:0}
.stage:-webkit-full-screen{height:100%;border-radius:0;border:0}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050816;display:block}
.overlay{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:24px;background:rgba(6,10,24,.84)}
.ov-title{font:700 1.2rem var(--display)}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--cyan);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{margin-top:14px;color:var(--muted)}

/* footer */
.foot{margin-top:64px;padding-bottom:28px}
.foot-in{border-radius:var(--r-lg);padding:18px 24px;display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center;color:var(--muted);font-size:.93rem}
.foot nav{display:flex;flex-wrap:wrap;gap:4px 8px}
.foot nav a{padding:10px 10px;min-height:44px;display:inline-flex;align-items:center;text-decoration:none;font-weight:600}
.foot nav a:hover{color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="app">
  <div class="topwrap">
    <header class="top glass">
      <a class="brand" href="#/" aria-label="NEXPLAY home">
        <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true" focusable="false"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d5cff"/><stop offset="1" stop-color="#29e1ff"/></linearGradient></defs><rect x="1.5" y="1.5" width="37" height="37" rx="12" fill="rgba(255,255,255,.08)" stroke="url(#lg)" stroke-width="1.5"/><path d="M12 29V11l16 18V11" fill="none" stroke="url(#lg)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="wordmark">NEXPLAY</span>
      </a>
      <nav class="dnav" id="dnav" aria-label="Primary"></nav>
      <form class="hsearch" id="hsearch" role="search">
        <label class="field"><span class="sr">Search games</span><span id="hs-ic" aria-hidden="true"></span><input type="search" id="hs-in" placeholder="Search games" autocomplete="off" maxlength="80"></label>
      </form>
      <button class="ibtn" id="menu" type="button" aria-expanded="false" aria-controls="sheet" aria-label="Menu"></button>
    </header>
    <nav class="sheet glass" id="sheet" aria-label="Primary menu" hidden></nav>
  </div>

  <main id="main" tabindex="-1"></main>

  <footer class="foot wrap">
    <div class="glass foot-in">
      <span>NEXPLAY preview build with demo games.</span>
      <nav aria-label="Footer"><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/privacy">Privacy</a><a href="#/terms">Terms</a></nav>
    </div>
  </footer>
</div>

<noscript><p style="padding:24px;color:#eaf0ff">NEXPLAY needs JavaScript to run games.</p></noscript>

<script>
(function(){
'use strict';

/* ---------- configuration (edit these) ---------- */
var CONFIG={
  contactEmail:'',            // add an address to show a mail link on the Contact page
  policyUpdated:'October 10, 2026'
};

/* ---------- tiny helpers ---------- */
function h(tag,attrs){
  var el=document.createElement(tag),kids=Array.prototype.slice.call(arguments,2);
  if(attrs)Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(v==null||v===false)return;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.indexOf('on')===0&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else el.setAttribute(k,v);
  });
  kids.reduce(function(a,b){return a.concat(b)},[]).forEach(function(kid){
    if(kid==null||kid===false)return;
    el.append(kid.nodeType?kid:document.createTextNode(String(kid)));
  });
  return el;
}
function $(s,r){return (r||document).querySelector(s)}
var ICONS={
  play:'<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',
  heart:'<path d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  expand:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  refresh:'<path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
};
function icon(n){
  var s=document.createElement('span');s.className='ic';
  s.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>';
  return s;
}
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- game runtime code (runs inside each sandboxed frame) ---------- */
var OPEN='<scr'+'ipt>',CLOSE='</scr'+'ipt>';
function body(fn){var s=fn.toString();return s.slice(s.indexOf('{')+1,s.lastIndexOf('}'))}
var BASE_CSS='html,body{margin:0;height:100%;background:#060a18;color:#eaf0ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}';
function canvasDoc(game){
  return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+BASE_CSS+'</style></head><body><canvas id="c" tabindex="0" aria-label="Game area"></canvas>'+OPEN+body(canvasBase)+'\n'+body(game)+'\nparent.postMessage({nexplay:"ready"},"*");'+CLOSE+'</body></html>';
}
function canvasBase(){
  var c=document.getElementById('c'),x=c.getContext('2d'),W=0,H=0;
  function fit(){var d=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=Math.round(W*d);c.height=Math.round(H*d);x.setTransform(d,0,0,d,0,0)}
  function msg(t,s){var u=Math.min(W,H);x.fillStyle='rgba(6,10,24,.6)';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#eaf0ff';x.font='700 '+Math.max(18,u/16)+'px system-ui,sans-serif';x.fillText(t,W/2,H/2);if(s){x.font='400 '+Math.max(13,u/32)+'px system-ui,sans-serif';x.fillStyle='rgba(234,240,255,.8)';x.fillText(s,W/2,H/2+Math.max(26,u/11))}}
  window.addEventListener('resize',fit);fit();
  window.addEventListener('error',function(){parent.postMessage({nexplay:'error'},'*')});
  window.addEventListener('keydown',function(e){if(e.key.indexOf('Arrow')===0||e.key===' ')e.preventDefault()});
  c.addEventListener('pointerdown',function(){c.focus()});
}

function gamePong(){
  var keys={},p={y:H/2},a={y:H/2},b={x:W/2,y:H/2,vx:0,vy:0},sc=[0,0],paused=true,last=0;
  function padH(){return Math.max(64,H*0.2)}
  function padW(){return Math.max(10,W*0.015)}
  function edge(){return Math.max(14,W*0.03)}
  function rad(){return Math.max(6,H*0.018)}
  function lim(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
  function serve(dir){var sp=Math.max(W,H)*0.5,ang=(Math.random()-0.5)*0.7;b.x=W/2;b.y=H/2;b.vx=Math.cos(ang)*sp*dir;b.vy=Math.sin(ang)*sp}
  function aim(e){var r=c.getBoundingClientRect();p.y=e.clientY-r.top;paused=false}
  c.addEventListener('pointermove',aim);
  c.addEventListener('pointerdown',aim);
  window.addEventListener('keydown',function(e){keys[e.key]=true;paused=false});
  window.addEventListener('keyup',function(e){keys[e.key]=false});
  function update(dt){
    var ph=padH(),r=rad(),pw=padW(),m=edge();
    if(keys.ArrowUp)p.y-=H*1.1*dt;
    if(keys.ArrowDown)p.y+=H*1.1*dt;
    p.y=lim(p.y,ph/2,H-ph/2);
    var s=H*0.6*dt;a.y+=lim(b.y-a.y,-s,s);a.y=lim(a.y,ph/2,H-ph/2);
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<r){b.y=r;b.vy=Math.abs(b.vy)}
    if(b.y>H-r){b.y=H-r;b.vy=-Math.abs(b.vy)}
    if(b.vx<0&&b.x-r<m+pw&&b.x>m&&Math.abs(b.y-p.y)<ph/2+r){b.x=m+pw+r;b.vx=Math.min(Math.abs(b.vx)*1.05,W*1.3);b.vy=lim(b.vy+(b.y-p.y)*3,-H*1.2,H*1.2)}
    if(b.vx>0&&b.x+r>W-m-pw&&b.x<W-m&&Math.abs(b.y-a.y)<ph/2+r){b.x=W-m-pw-r;b.vx=-Math.min(Math.abs(b.vx)*1.05,W*1.3);b.vy=lim(b.vy+(b.y-a.y)*3,-H*1.2,H*1.2)}
    if(b.x<-r){sc[1]++;serve(1)}
    if(b.x>W+r){sc[0]++;serve(-1)}
  }
  function draw(){
    var ph=padH(),pw=padW(),m=edge(),r=rad();
    x.fillStyle='#060a18';x.fillRect(0,0,W,H);
    x.setLineDash([8,12]);x.strokeStyle='rgba(234,240,255,.18)';x.lineWidth=2;x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);
    x.textAlign='center';x.fillStyle='rgba(234,240,255,.3)';x.font='700 '+Math.max(28,H/8)+'px system-ui,sans-serif';
    x.fillText(String(sc[0]),W/2-W/6,H/5);x.fillText(String(sc[1]),W/2+W/6,H/5);
    x.fillStyle='#29e1ff';x.fillRect(m,p.y-ph/2,pw,ph);
    x.fillStyle='#ff7ad9';x.fillRect(W-m-pw,a.y-ph/2,pw,ph);
    x.fillStyle='#eaf0ff';x.beginPath();x.arc(b.x,b.y,r,0,6.2832);x.fill();
    if(paused)msg('Move to start','Mouse, touch, or arrow keys');
  }
  function frame(ts){var dt=Math.min(0.05,(ts-last)/1000);last=ts;if(!paused)update(dt);draw();requestAnimationFrame(frame)}
  serve(1);requestAnimationFrame(frame);
}

function gameStars(){
  var bx=W/2,stars=[],score=0,best=0,lives=3,over=false,started=false,timer=0,last=0,keys={};
  function reset(){stars=[];score=0;lives=3;over=false;timer=0}
  function bw(){return Math.max(76,W*0.16)}
  function by(){return H-38}
  function move(e){var r=c.getBoundingClientRect();bx=e.clientX-r.left;started=true}
  c.addEventListener('pointermove',move);
  c.addEventListener('pointerdown',function(e){move(e);if(over)reset()});
  window.addEventListener('keydown',function(e){keys[e.key]=true;started=true;if(over&&(e.key===' '||e.key==='Enter'))reset()});
  window.addEventListener('keyup',function(e){keys[e.key]=false});
  function spawn(){var bad=Math.random()<0.22;stars.push({x:20+Math.random()*(W-40),y:-20,v:H*(0.24+Math.random()*0.18+Math.min(score,40)*0.006),bad:bad,r:bad?13:11})}
  function step(ts){
    var dt=Math.min(0.05,(ts-last)/1000);last=ts;
    if(started&&!over){
      if(keys.ArrowLeft)bx-=W*0.9*dt;
      if(keys.ArrowRight)bx+=W*0.9*dt;
      bx=Math.max(bw()/2,Math.min(W-bw()/2,bx));
      timer+=dt;
      if(timer>Math.max(0.35,0.75-score*0.01)){timer=0;spawn()}
      for(var i=stars.length-1;i>=0;i--){
        var s=stars[i];s.y+=s.v*dt;
        if(s.y>by()-s.r&&s.y<by()+14&&Math.abs(s.x-bx)<bw()/2+s.r){if(s.bad)lives--;else score++;stars.splice(i,1);continue}
        if(s.y>H+20){if(!s.bad)lives--;stars.splice(i,1)}
      }
      if(lives<=0){over=true;best=Math.max(best,score)}
    }
    draw();requestAnimationFrame(step);
  }
  function draw(){
    x.fillStyle='#060a18';x.fillRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      if(s.bad){x.fillStyle='#ff5a7a';x.beginPath();x.arc(s.x,s.y,s.r,0,6.2832);x.fill();x.strokeStyle='rgba(255,90,122,.5)';x.lineWidth=3;x.beginPath();x.arc(s.x,s.y,s.r+5,0,6.2832);x.stroke()}
      else{x.fillStyle='#ffe66d';x.beginPath();for(var k=0;k<10;k++){var an=-Math.PI/2+k*Math.PI/5,rr=k%2?s.r*0.45:s.r*1.2,qx=s.x+Math.cos(an)*rr,qy=s.y+Math.sin(an)*rr;if(k===0)x.moveTo(qx,qy);else x.lineTo(qx,qy)}x.closePath();x.fill()}
    }
    var w=bw();x.fillStyle='#29e1ff';x.beginPath();x.moveTo(bx-w/2,by());x.lineTo(bx+w/2,by());x.lineTo(bx+w/2-10,by()+16);x.lineTo(bx-w/2+10,by()+16);x.closePath();x.fill();
    x.fillStyle='#eaf0ff';x.font='700 18px system-ui,sans-serif';x.textAlign='left';x.fillText('Score '+score,16,30);x.textAlign='right';x.fillText('Lives '+lives,W-16,30);
    if(!started)msg('Move to start','Catch the stars. Dodge the red meteors.');
    else if(over)msg('Game over','Score '+score+'   Best '+best+'. Tap to play again.');
  }
  requestAnimationFrame(step);
}

function gameSnake(){
  var cols=W<H?14:22,rows=W<H?20:14,snake,dir,next,food,score=0,best=0,over=false,started=false,acc=0,last=0,down=false,sx=0,sy=0;
  function put(){var ok=false;while(!ok){food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};ok=true;for(var i=0;i<snake.length;i++){if(snake[i].x===food.x&&snake[i].y===food.y)ok=false}}}
  function reset(){snake=[{x:Math.floor(cols/2),y:Math.floor(rows/2)}];dir={x:1,y:0};next=dir;score=0;over=false;put()}
  function turn(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy};started=true}
  function die(){over=true;best=Math.max(best,score)}
  function tick(){
    dir=next;
    var hd={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(hd.x<0||hd.y<0||hd.x>=cols||hd.y>=rows){die();return}
    var eating=hd.x===food.x&&hd.y===food.y;
    /* The tail moves away on a normal step, so entering its current cell is legal. */
    var checkLength=eating?snake.length:snake.length-1;
    for(var i=0;i<checkLength;i++){if(snake[i].x===hd.x&&snake[i].y===hd.y){die();return}}
    snake.unshift(hd);
    if(eating){score++;put()}else snake.pop();
  }
  window.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowUp'||k==='w'||k==='W')turn(0,-1);
    else if(k==='ArrowDown'||k==='s'||k==='S')turn(0,1);
    else if(k==='ArrowLeft'||k==='a'||k==='A')turn(-1,0);
    else if(k==='ArrowRight'||k==='d'||k==='D')turn(1,0);
    else if((k===' '||k==='Enter')&&over)reset();
  });
  c.addEventListener('pointerdown',function(e){down=true;sx=e.clientX;sy=e.clientY;if(over)reset();started=true});
  c.addEventListener('pointermove',function(e){
    if(!down)return;
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
    if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
    sx=e.clientX;sy=e.clientY;
  });
  window.addEventListener('pointerup',function(){down=false});
  window.addEventListener('pointercancel',function(){down=false});
  function step(ts){
    var dt=Math.min(0.05,(ts-last)/1000);last=ts;
    if(started&&!over){acc+=dt;var iv=Math.max(0.06,0.14-score*0.003);while(acc>=iv){acc-=iv;tick();if(over)break}}
    draw();requestAnimationFrame(step);
  }
  function draw(){
    var cs=Math.floor(Math.min(W/cols,H/rows)),ox=Math.floor((W-cs*cols)/2),oy=Math.floor((H-cs*rows)/2);
    x.fillStyle='#060a18';x.fillRect(0,0,W,H);
    x.fillStyle='rgba(255,255,255,.05)';x.fillRect(ox,oy,cs*cols,cs*rows);
    x.strokeStyle='rgba(41,225,255,.35)';x.lineWidth=2;x.strokeRect(ox,oy,cs*cols,cs*rows);
    x.fillStyle='#ffe66d';x.beginPath();x.arc(ox+food.x*cs+cs/2,oy+food.y*cs+cs/2,cs*0.32,0,6.2832);x.fill();
    for(var i=snake.length-1;i>=0;i--){var t=snake.length>1?i/(snake.length-1):0,s=snake[i];x.fillStyle='hsl('+Math.round(190+t*80)+',90%,60%)';x.fillRect(ox+s.x*cs+1,oy+s.y*cs+1,cs-2,cs-2)}
    x.fillStyle='#eaf0ff';x.font='700 18px system-ui,sans-serif';x.textAlign='left';x.fillText('Score '+score,ox+10,oy+26);
    if(!started)msg('Tap or press a key','Swipe or use the arrow keys to steer.');
    else if(over)msg('Game over','Score '+score+'   Best '+best+'. Tap to play again.');
  }
  reset();requestAnimationFrame(step);
}

function gamePulse(){
  var T=[],score=0,best=0,left=30,run=false,gap=0,last=0,done=false,endT=0;
  function begin(){T=[];score=0;left=30;run=true;gap=0;done=false}
  c.addEventListener('pointerdown',function(e){
    if(!run){if(done&&performance.now()-endT<700)return;begin();return}
    var r=c.getBoundingClientRect(),qx=e.clientX-r.left,qy=e.clientY-r.top;
    for(var i=T.length-1;i>=0;i--){var t=T[i];if(Math.hypot(qx-t.x,qy-t.y)<=t.r+12){score+=Math.max(1,Math.round((1-t.age/t.life)*10));T.splice(i,1);return}}
  });
  window.addEventListener('keydown',function(e){if(!run&&(e.key===' '||e.key==='Enter'))begin()});
  function step(ts){
    var dt=Math.min(0.05,(ts-last)/1000);last=ts;
    if(run){
      left-=dt;gap+=dt;
      if(gap>0.55){gap=0;var r=Math.max(26,Math.min(W,H)*0.07);T.push({x:r+Math.random()*(W-2*r),y:60+r+Math.random()*Math.max(1,H-120-2*r),r:r,age:0,life:1.4})}
      for(var i=T.length-1;i>=0;i--){T[i].age+=dt;if(T[i].age>T[i].life)T.splice(i,1)}
      if(left<=0){run=false;done=true;endT=performance.now();best=Math.max(best,score);T=[]}
    }
    draw();requestAnimationFrame(step);
  }
  function draw(){
    x.fillStyle='#060a18';x.fillRect(0,0,W,H);
    for(var i=0;i<T.length;i++){
      var t=T[i],k=1-t.age/t.life;
      x.fillStyle='rgba(41,225,255,.9)';x.beginPath();x.arc(t.x,t.y,t.r,0,6.2832);x.fill();
      x.strokeStyle='rgba(255,122,217,.85)';x.lineWidth=3;x.beginPath();x.arc(t.x,t.y,t.r+k*t.r*1.1,0,6.2832);x.stroke();
    }
    x.fillStyle='#eaf0ff';x.font='700 18px system-ui,sans-serif';x.textAlign='left';x.fillText('Score '+score,16,30);x.textAlign='right';x.fillText('Time '+Math.max(0,Math.ceil(left)),W-16,30);
    if(!run&&!done)msg('Tap to start','Tap targets before the ring closes. 30 seconds.');
    if(!run&&done)msg('Time is up','Score '+score+'   Best '+best+'. Tap to play again.');
  }
  requestAnimationFrame(step);
}

function gameMatch(){
  var shapes=[['Circle','<circle cx="12" cy="12" r="8"/>'],['Square','<rect x="4" y="4" width="16" height="16" rx="2"/>'],['Triangle','<path d="M12 4l9 16H3z"/>'],['Diamond','<path d="M12 2l10 10-10 10L2 12z"/>'],['Star','<path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8l-6.4 3.7 1.7-7.2L2 9.6 9 9z"/>'],['Hexagon','<path d="M12 2l8.7 5v10L12 22l-8.7-5V7z"/>'],['Plus','<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>'],['Ring','<circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="4"/>']];
  var colors=['#29e1ff','#ff7ad9','#ffe66d','#b88aff','#6ee7a8','#ff9f5a','#8fb4ff','#f472b6'];
  var board=document.getElementById('b'),info=document.getElementById('i'),done=document.getElementById('d');
  var order=[],open=[],moves=0,matched=0,lock=false;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function face(btn,idx,show){
    var v=order[idx];
    if(show){btn.classList.add('up');btn.style.color=colors[v];btn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+shapes[v][1]+'</svg>';btn.setAttribute('aria-label','Card '+(idx+1)+', '+shapes[v][0])}
    else{btn.classList.remove('up');btn.style.color='';btn.innerHTML='';btn.setAttribute('aria-label','Card '+(idx+1)+', face down')}
  }
  function flip(btn,idx){
    if(lock||btn.classList.contains('up'))return;
    face(btn,idx,true);open.push({b:btn,i:idx});
    if(open.length<2)return;
    moves++;info.textContent='Moves: '+moves;
    var A=open[0],B=open[1];
    if(order[A.i]===order[B.i]){
      A.b.disabled=true;B.b.disabled=true;A.b.classList.add('ok');B.b.classList.add('ok');open=[];matched++;
      if(matched===8){done.hidden=false;document.getElementById('dm').textContent='Cleared in '+moves+' moves.';document.getElementById('again').focus()}
    }else{
      lock=true;
      setTimeout(function(){face(A.b,A.i,false);face(B.b,B.i,false);open=[];lock=false},800);
    }
  }
  function start(){
    order=[];for(var i=0;i<8;i++){order.push(i,i)}
    shuffle(order);open=[];moves=0;matched=0;lock=false;done.hidden=true;info.textContent='Moves: 0';board.innerHTML='';
    order.forEach(function(v,idx){
      var btn=document.createElement('button');btn.type='button';btn.className='k';btn.setAttribute('aria-label','Card '+(idx+1)+', face down');
      btn.addEventListener('click',function(){flip(btn,idx)});board.appendChild(btn);
    });
  }
  document.getElementById('again').addEventListener('click',start);
  start();
}

  setNav();
  var hd=main.querySelector('h1');
  if(hd){hd.setAttribute('tabindex','-1');if(!firstRoute)hd.focus({preventScroll:true})}
  if(!soft)window.scrollTo(0,0);
  firstRoute=false;
}
window.addEventListener('hashchange',function(){route(false)});

/* ---------- ambient particles ---------- */
var pc=$('#fx'),px=pc.getContext('2d'),ps=[],pw=0,ph=0,raf=0,fxOn=true,reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
function pinit(){
  var d=Math.min(window.devicePixelRatio||1,1.5);
  pw=window.innerWidth;ph=window.innerHeight;pc.width=Math.round(pw*d);pc.height=Math.round(ph*d);px.setTransform(d,0,0,d,0,0);
  var n=Math.round(Math.min(46,Math.max(18,pw/32)));ps=[];
  for(var i=0;i<n;i++)ps.push({x:Math.random()*pw,y:Math.random()*ph,r:Math.random()*1.6+.6,v:Math.random()*.25+.08,a:Math.random()*.5+.2,c:Math.random()<.5?'157,92,255':'41,225,255'});
}
function ptick(){
  px.clearRect(0,0,pw,ph);
  for(var i=0;i<ps.length;i++){var p=ps[i];p.y-=p.v;if(p.y<-4){p.y=ph+4;p.x=Math.random()*pw}px.fillStyle='rgba('+p.c+','+p.a+')';px.beginPath();px.arc(p.x,p.y,p.r,0,6.2832);px.fill()}
  raf=requestAnimationFrame(ptick);
}
function fxState(){
  cancelAnimationFrame(raf);raf=0;
  if(reduce.matches||document.hidden||!fxOn){px.clearRect(0,0,pw,ph);return}
  raf=requestAnimationFrame(ptick);
}
function setFx(on){fxOn=on;fxState()}
document.addEventListener('visibilitychange',fxState);
if(reduce.addEventListener)reduce.addEventListener('change',fxState);
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){pinit();fxState()},200)});
pinit();

route(false);
})();
</script>
</body>
